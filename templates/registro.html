{% extends "base.html" %}

{% block title %}Registro - NequiZ{% endblock %}
{% block subtitle %}Crear Cuenta Nueva{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="color: #667eea; margin-bottom: 25px; text-align: center;">Registro</h2>
    
    <form id="registroForm">
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input 
                type="text" 
                id="nombre" 
                placeholder="Juan Pérez" 
                required
                minlength="2"
            >
        </div>

        <div class="form-group">
            <label for="numeroTelefono">Número de Teléfono</label>
            <input 
                type="text" 
                id="numeroTelefono" 
                placeholder="3001234567" 
                required 
                pattern="[0-9]{10}"
                maxlength="10"
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                placeholder="juan@email.com" 
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Mínimo 6 caracteres" 
                required
                minlength="6"
            >
        </div>

        <div class="form-group">
            <label for="passwordConfirm">Confirmar Contraseña</label>
            <input 
                type="password" 
                id="passwordConfirm" 
                placeholder="Repite tu contraseña" 
                required
            >
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-bottom: 15px;">
            Crear Cuenta
        </button>

        <div style="text-align: center; margin-top: 20px;">
            <p style="color: #666;">¿Ya tienes cuenta? 
                <a href="/login" style="color: #667eea; font-weight: 600;">Inicia sesión aquí</a>
            </p>
        </div>
    </form>

    <div id="loading" class="loading hidden">
        <p>Creando cuenta...</p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Verificar si ya está autenticado
    if (estaAutenticado()) {
        window.location.href = '/perfil';
    }

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value.trim();
        const numeroTelefono = document.getElementById('numeroTelefono').value;
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;

        // Validaciones
        if (!/^[0-9]{10}$/.test(numeroTelefono)) {
            mostrarAlerta('Número de teléfono inválido (debe ser 10 dígitos)', 'error');
            return;
        }

        if (password !== passwordConfirm) {
            mostrarAlerta('Las contraseñas no coinciden', 'error');
            return;
        }

        if (password.length < 6) {
            mostrarAlerta('La contraseña debe tener al menos 6 caracteres', 'error');
            return;
        }

        // Mostrar loading
        document.getElementById('registroForm').style.display = 'none';
        document.getElementById('loading').classList.remove('hidden');

        try {
            const response = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nombre,
                    numeroTelefono,
                    email,
                    password
                })
            });

            const data = await response.json();

            if (response.ok) {
                // Guardar tokens
                guardarToken(data.accessToken, data.refreshToken);
                
                mostrarAlerta('¡Cuenta creada exitosamente! Redirigiendo...', 'success');
                
                // Redirigir a perfil
                setTimeout(() => {
                    window.location.href = '/perfil';
                }, 1500);
            } else {
                // Mostrar error
                mostrarAlerta(data.error || 'Error al crear cuenta', 'error');
                document.getElementById('registroForm').style.display = 'block';
                document.getElementById('loading').classList.add('hidden');
            }
        } catch (error) {
            console.error('Error:', error);
            mostrarAlerta('Error de conexión. Intenta nuevamente', 'error');
            document.getElementById('registroForm').style.display = 'block';
            document.getElementById('loading').classList.add('hidden');
        }
    });
</script>
{% endblock %}
